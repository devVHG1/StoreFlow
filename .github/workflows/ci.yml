name: StoreFlow CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci-only-ephemeral-database
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: "8.0.x"
      - name: Select installed SDK
        run: echo '{"sdk":{"version":"${{ steps.dotnet.outputs.dotnet-version }}"}}' > global.json
      - name: Check public configuration
        shell: pwsh
        run: ./scripts/Test-PublicConfiguration.ps1
      - name: Restore
        run: dotnet restore StoreFlow.sln
      - name: Build
        run: dotnet build StoreFlow.sln -c Release --no-restore --nologo
      - name: Frontend regression tests
        run: node --test scripts/frontend-tests.cjs
      - name: Audit dependencies
        shell: pwsh
        run: |
          $json = dotnet list StoreFlow.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed.' }
          $report = ($json -join "`n") | ConvertFrom-Json
          $packages = @($report.projects | ForEach-Object { $_.frameworks } | ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | Where-Object { $_.vulnerabilities.Count -gt 0 })
          if ($packages.Count -gt 0) {
            $packages | Select-Object id, resolvedVersion | Format-Table
            throw 'Known vulnerable dependencies found.'
          }
          Write-Output 'No known vulnerable NuGet dependencies found.'
      - name: Unit tests
        run: dotnet test StoreFlow.UnitTests -c Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
      - name: Integration tests
        run: dotnet run --project StoreFlow.IntegrationTests -c Release --no-build -- "$GITHUB_WORKSPACE"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            StoreFlow.IntegrationTests/results/
          if-no-files-found: warn

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Start and verify full stack
        shell: pwsh
        run: ./scripts/Start-Docker.ps1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop temporary stack
        if: always()
        run: docker compose down
